<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller de vídeo</title>
<style>
:root{--bg:#f2f3f5;--panel:#fff;--line:#d3d8e0;--tx:#161a22;--mut:#5b6472;--ac:#0b7a75;--acx:#fff;--dan:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--panel:#1b1f27;--line:#2b313c;--tx:#e9ecf1;--mut:#9aa3b2;--ac:#3ddbc9;--acx:#06201d;--dan:#ff8a80}}
:root[data-theme="dark"]{--bg:#12151b;--panel:#1b1f27;--line:#2b313c;--tx:#e9ecf1;--mut:#9aa3b2;--ac:#3ddbc9;--acx:#06201d;--dan:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Bahnschrift,"Segoe UI",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
h2{font-size:15px;margin:0 0 10px}
main{display:grid;gap:16px;padding:16px;max-width:1100px;margin:0 auto;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:60vh;margin:0 auto;background:#000;border-radius:6px;overflow:hidden;container-type:size}
.stage video{width:100%;height:100%;object-fit:contain;display:block}
.ov{position:absolute;left:4%;right:4%;text-align:center;color:#fff;font-weight:700;font-size:calc(var(--sz,8)*1cqh);text-shadow:0 0 4px #000,0 0 2px #000;line-height:1.1;pointer-events:none;white-space:pre-wrap}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#aab;text-align:center;padding:20px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p,.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--dan)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
label b{color:var(--tx);font-weight:600;float:right}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=text],select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx)}
.lib{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lib li{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.lib span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.note{color:var(--mut);font-size:13px}
#out video{width:100%;border-radius:6px;margin-top:8px}
.full{grid-column:1/-1}
.fx{position:absolute;inset:0;pointer-events:none}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tool{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Taller de vídeo</h1>
  <label class="btn p" style="margin:0;color:var(--acx)">Importar vídeo<input id="file" type="file" accept="video/*" hidden></label>
</header>
<main>
  <section class="card">
    <div class="stage" id="stage">
      <video id="v" playsinline></video>
      <div class="fx" id="vg"></div><div class="fx" id="fd" style="background:#000;opacity:0"></div><div class="ov" id="ov"></div>
      <div class="empty" id="empty">Importa un vídeo para empezar a editarlo.</div>
    </div>
    <label>Inicio del recorte <b id="la">0.0 s</b></label>
    <input type="range" id="a" min="0" max="1" step="0.1" value="0">
    <label>Final del recorte <b id="lb">0.0 s</b></label>
    <input type="range" id="b" min="0" max="1" step="0.1" value="1">
    <div class="row">
      <button id="play" class="p" disabled>Reproducir recorte</button>
      <button id="save" disabled>Guardar proyecto</button>
      <button id="exp" disabled>Exportar vídeo</button>
    </div>
    <div class="bar" id="bar"><i id="bi"></i></div>
    <div id="out"></div>
  </section>

  <section class="card">
    <h2>Ajustes</h2>
    <label>Nombre del proyecto</label>
    <input type="text" id="name" placeholder="Mi vídeo">
    <label>Velocidad <b id="lsp">1×</b></label>
    <input type="range" id="sp" min="0.25" max="3" step="0.25" value="1">
    <label>Brillo <b id="lbr">100%</b></label>
    <input type="range" id="br" min="50" max="150" value="100">
    <label>Contraste <b id="lco">100%</b></label>
    <input type="range" id="co" min="50" max="150" value="100">
    <label>Saturación <b id="lsa">100%</b></label>
    <input type="range" id="sa" min="0" max="200" value="100">
    <label>Blanco y negro <b id="lgr">0%</b></label>
    <input type="range" id="gr" min="0" max="100" value="0">
    <label>Texto sobre el vídeo</label>
    <input type="text" id="txt" placeholder="Escribe un título">
    <div class="row">
      <select id="pos" style="flex:1"><option value="top">Arriba</option><option value="mid">Centro</option><option value="bot" selected>Abajo</option></select>
    </div>
    <label>Tamaño del texto <b id="lsz">8</b></label>
    <input type="range" id="sz" min="3" max="20" value="8">
    <div class="row"><label style="margin:0"><input type="checkbox" id="mute"> Quitar el sonido</label></div>
  </section>
  <section class="card full">
    <h2>Herramientas</h2>
    <div class="row" style="margin-top:0"><select id="tsel" style="flex:1;min-width:160px"></select><button id="tadd" class="p">Añadir herramienta</button></div>
    <div id="tools" class="tg"></div>
  </section>

  <section class="card full">
    <h2>Mis proyectos</h2>
    <ul class="lib" id="lib"></ul>
    <p class="note" id="libnote"></p>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const v=$('#v');

/* ---------- Servicio de datos (base de datos local, IndexedDB) ---------- */
const Store={db:null,
  open(){return new Promise((ok,no)=>{const r=indexedDB.open('taller-video',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});
    r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>no(r.error)})},
  tx(m,f){return new Promise((ok,no)=>{const t=this.db.transaction('p',m);const q=f(t.objectStore('p'));
    t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})},
  all(){return this.tx('readonly',s=>s.getAll())},
  put(p){return this.tx('readwrite',s=>s.put(p))},
  del(id){return this.tx('readwrite',s=>s.delete(id))}
};

/* ---------- Servicio de edición ---------- */
const DEF={a:0,b:null,sp:1,br:100,co:100,sa:100,gr:0,txt:'',pos:'bot',sz:8,mute:false};
let cur=null,url=null;
const ids=['sp','br','co','sa','gr','sz'];
const unit={sp:'×',br:'%',co:'%',sa:'%',gr:'%',sz:''};

/* ---------- Herramientas añadibles ----------
   Para crear una nueva, añade una entrada a TOOLS:
   name, min/max/step/def/unit (slider) y css(v) si es un filtro de color.
   Las que no son filtros (viñeta, fundido, girar, espejo) se dibujan en geo(), fxPreview() y exportar. */
const TOOLS={
  sepia:{name:'Sepia',min:0,max:100,def:70,unit:'%',css:v=>`sepia(${v}%)`},
  blur:{name:'Desenfoque',min:1,max:12,def:3,unit:' px',css:v=>`blur(${v}px)`},
  hue:{name:'Cambio de color',min:0,max:360,def:90,unit:'°',css:v=>`hue-rotate(${v}deg)`},
  inv:{name:'Invertir colores',min:0,max:100,def:100,unit:'%',css:v=>`invert(${v}%)`},
  vig:{name:'Viñeta',min:10,max:100,def:60,unit:'%'},
  fade:{name:'Fundido a negro (inicio y final)',min:0.5,max:3,step:0.5,def:1,unit:' s'},
  rot:{name:'Girar',min:90,max:270,step:90,def:90,unit:'°'},
  flip:{name:'Espejo horizontal'}
};
function tv(k){const t=(cur.s.tools||[]).find(t=>t.k===k);return t?t.v:null}
function fadeA(t){const d=tv('fade');if(!d)return 0;return Math.min(1,Math.max(0,1-(t-cur.s.a)/d,1-(cur.s.b-t)/d))}
function geo(){const f=tv('flip')?-1:1,r=tv('rot')||0,sw=$('#stage').clientWidth,sh=$('#stage').clientHeight;
  const sc=(r%180)?Math.min(sw/sh,sh/sw):1;v.style.transform=`rotate(${r}deg) scale(${f*sc},${sc})`}
function fxPreview(){const vg=tv('vig');
  $('#vg').style.background=vg?`radial-gradient(ellipse at center,transparent ${70-vg*.4}%,rgba(0,0,0,${vg/100}) 100%)`:'none'}
(function tick(){if(cur)$('#fd').style.opacity=fadeA(v.currentTime);requestAnimationFrame(tick)})();
function renderTools(){
  const box=$('#tools');box.innerHTML='';
  (cur?cur.s.tools:[]).forEach((t,i)=>{
    const T=TOOLS[t.k],d=document.createElement('div');d.className='tool';
    d.innerHTML=`<div class="row" style="justify-content:space-between;margin:0"><strong>${T.name}</strong><button class="d">Quitar</button></div>`+
      (T.max?`<input type="range" min="${T.min}" max="${T.max}" step="${T.step||1}" value="${t.v}"><span class="note">${t.v}${T.unit}</span>`:'');
    const r=d.querySelector('input'),n=d.querySelector('span');
    if(r)r.oninput=()=>{t.v=+r.value;n.textContent=t.v+T.unit;Editor.apply()};
    d.querySelector('button').onclick=()=>{cur.s.tools.splice(i,1);renderTools();Editor.apply()};
    box.append(d);
  });
}
$('#tsel').innerHTML=Object.entries(TOOLS).map(([k,T])=>`<option value="${k}">${T.name}</option>`).join('');
$('#tadd').onclick=()=>{
  if(!cur)return;const k=$('#tsel').value;
  if(cur.s.tools.some(t=>t.k===k))return;
  cur.s.tools.push({k,v:TOOLS[k].def||1});renderTools();Editor.apply();
};

const Editor={
  filter(s){return `brightness(${s.br}%) contrast(${s.co}%) saturate(${s.sa}%) grayscale(${s.gr}%) `+(s.tools||[]).map(t=>TOOLS[t.k].css?TOOLS[t.k].css(t.v):'').join(' ')},
  apply(){
    const s=cur.s;
    v.style.filter=this.filter(s);geo();fxPreview();
    v.playbackRate=s.sp;v.muted=s.mute;
    const o=$('#ov');o.textContent=s.txt;o.style.setProperty('--sz',s.sz);
    o.style.top=s.pos==='top'?'6%':s.pos==='mid'?'42%':'auto';
    o.style.bottom=s.pos==='bot'?'6%':'auto';
    ids.forEach(k=>$('#l'+k).textContent=s[k]+unit[k]);
    $('#la').textContent=s.a.toFixed(1)+' s';$('#lb').textContent=s.b.toFixed(1)+' s';
  },
  load(p){
    if(url)URL.revokeObjectURL(url);
    cur={...p,s:{...DEF,...p.s}};cur.s.tools=[...(p.s.tools||[])];
    url=URL.createObjectURL(p.blob);v.src=url;
    $('#empty').style.display='none';$('#out').innerHTML='';
    v.onloadedmetadata=()=>{
      const d=v.duration;
      if(cur.s.b==null||cur.s.b>d)cur.s.b=d;
      $('#stage').style.aspectRatio=v.videoWidth+'/'+v.videoHeight;
      ['a','b'].forEach(k=>{$('#'+k).max=d;$('#'+k).value=cur.s[k]});
      ids.forEach(k=>$('#'+k).value=cur.s[k]);
      $('#txt').value=cur.s.txt;$('#pos').value=cur.s.pos;$('#mute').checked=cur.s.mute;
      $('#name').value=cur.name;
      ['play','save','exp'].forEach(i=>$('#'+i).disabled=false);
      v.currentTime=cur.s.a;this.apply();renderTools();
    };
  },
  async export(){
    const s=cur.s,w=v.videoWidth,h=v.videoHeight;
    const r=tv('rot')||0,cw=r%180?h:w,ch=r%180?w:h;const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
    const st=c.captureStream(30);
    if(!s.mute){try{v.captureStream().getAudioTracks().forEach(t=>st.addTrack(t))}catch(e){}}
    const mime=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
    if(!mime)throw new Error('Este navegador no puede exportar vídeo.');
    const rec=new MediaRecorder(st,{mimeType:mime}),chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    const done=new Promise(r=>rec.onstop=r);
    v.pause();v.currentTime=s.a;
    await new Promise(r=>v.addEventListener('seeked',r,{once:true}));
    this.apply();rec.start();await v.play();
    const bar=$('#bar');bar.style.display='block';
    const draw=()=>{
      x.save();x.translate(cw/2,ch/2);x.rotate(r*Math.PI/180);if(tv('flip'))x.scale(-1,1);x.filter=this.filter(s);x.drawImage(v,-w/2,-h/2,w,h);x.restore();
      const vg=tv('vig');if(vg){const g=x.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*(.35-vg/400),cw/2,ch/2,Math.max(cw,ch)*.7);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${vg/100})`);x.fillStyle=g;x.fillRect(0,0,cw,ch)}
      const fa=fadeA(v.currentTime);if(fa>0){x.fillStyle=`rgba(0,0,0,${fa})`;x.fillRect(0,0,cw,ch)}
      if(s.txt){
        x.font=`700 ${s.sz*ch/100}px sans-serif`;x.textAlign='center';x.textBaseline='middle';
        x.lineWidth=ch/150;x.strokeStyle='#000';x.fillStyle='#fff';
        const y=s.pos==='top'?ch*.1:s.pos==='mid'?ch*.5:ch*.9;
        x.strokeText(s.txt,cw/2,y,cw*.92);x.fillText(s.txt,cw/2,y,cw*.92);
      }
      $('#bi').style.width=Math.min(100,(v.currentTime-s.a)/(s.b-s.a)*100)+'%';
      if(v.currentTime>=s.b||v.ended){v.pause();rec.stop();return}
      requestAnimationFrame(draw);
    };
    draw();await done;bar.style.display='none';
    return new Blob(chunks,{type:mime.split(';')[0]});
  }
};

/* ---------- Interfaz ---------- */
function bind(){
  ['a','b'].forEach(k=>$('#'+k).oninput=e=>{
    if(!cur)return;let n=+e.target.value;
    if(k==='a')n=Math.min(n,cur.s.b-.1);else n=Math.max(n,cur.s.a+.1);
    cur.s[k]=n;e.target.value=n;if(k==='a')v.currentTime=n;Editor.apply();
  });
  ids.forEach(k=>$('#'+k).oninput=e=>{if(cur){cur.s[k]=+e.target.value;Editor.apply()}});
  $('#txt').oninput=e=>{if(cur){cur.s.txt=e.target.value;Editor.apply()}};
  $('#pos').onchange=e=>{if(cur){cur.s.pos=e.target.value;Editor.apply()}};
  $('#mute').onchange=e=>{if(cur){cur.s.mute=e.target.checked;Editor.apply()}};
  $('#name').oninput=e=>{if(cur)cur.name=e.target.value};
  v.ontimeupdate=()=>{if(cur&&!v.paused&&v.currentTime>=cur.s.b&&!$('#exp').dataset.busy){v.pause();v.currentTime=cur.s.a}};
  $('#play').onclick=()=>{
    if(v.paused){if(v.currentTime<cur.s.a||v.currentTime>=cur.s.b)v.currentTime=cur.s.a;v.play()}else v.pause();
  };
  $('#file').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const p={id:'p'+Date.now(),name:f.name.replace(/\.[^.]+$/,''),blob:f,s:{...DEF},updated:Date.now()};
    Editor.load(p);await save(true);e.target.value='';
  };
  $('#save').onclick=()=>save();
  $('#exp').onclick=async()=>{
    const b=$('#exp');b.disabled=true;b.dataset.busy=1;b.textContent='Exportando…';
    try{
      const blob=await Editor.export();
      const u=URL.createObjectURL(blob);
      $('#out').innerHTML=`<p class="note">Vídeo listo. Mantén pulsado o usa el menú del reproductor para guardarlo.</p><video controls src="${u}"></video>`;
    }catch(err){$('#out').innerHTML=`<p class="note">No se pudo exportar: ${err.message}</p>`}
    delete b.dataset.busy;b.disabled=false;b.textContent='Exportar vídeo';
  };
}

async function save(quiet){
  if(!cur)return;
  try{
    cur.updated=Date.now();
    await Store.put({id:cur.id,name:cur.name||'Sin título',blob:cur.blob,s:cur.s,updated:cur.updated});
    await renderLib();
    if(!quiet){$('#save').textContent='Guardado';setTimeout(()=>$('#save').textContent='Guardar proyecto',1200)}
  }catch(e){$('#libnote').textContent='No se pudo guardar en este navegador.'}
}

async function renderLib(){
  const ul=$('#lib');ul.innerHTML='';
  let list=[];
  try{list=(await Store.all()).sort((a,b)=>b.updated-a.updated)}catch(e){$('#libnote').textContent='La base de datos no está disponible en este navegador.';return}
  $('#libnote').textContent=list.length?'':'Aún no tienes proyectos. Importa un vídeo y se guardará aquí.';
  list.forEach(p=>{
    const li=document.createElement('li');
    const n=document.createElement('span');n.textContent=p.name;
    const g=document.createElement('div');g.className='row';g.style.margin=0;
    const o=document.createElement('button');o.textContent='Abrir';o.onclick=()=>{Editor.load(p);scrollTo({top:0,behavior:'smooth'})};
    const d=document.createElement('button');d.textContent='Borrar';d.className='d';
    d.onclick=async()=>{
      if(!confirm('¿Borrar «'+p.name+'»? No se puede deshacer.'))return;
      await Store.del(p.id);
      if(cur&&cur.id===p.id){cur=null;v.removeAttribute('src');v.load();$('#empty').style.display='grid';['play','save','exp'].forEach(i=>$('#'+i).disabled=true)}
      renderLib();
    };
    g.append(o,d);li.append(n,g);ul.append(li);
  });
}

bind();
Store.open().then(renderLib).catch(()=>{$('#libnote').textContent='La base de datos no está disponible en este navegador.'});
</script>
</body>
</html>
